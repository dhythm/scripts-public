[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ruff>=0.12.2",
    "Pillow>=10.2.0",
    "matplotlib>=3.8.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.1",
    "pydub>=0.25.1",
    "tqdm>=4.66.0",
    "noisereduce>=3.0.3",
    "httpx>=0.27.0",
    "openai>=1.51.0",
    "python-dotenv>=1.0.1",
    "google-cloud-texttospeech>=2.17.1",
    "typer>=0.12.3",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=5.2.2",
    "rich>=13.7.1",
    "pyyaml>=6.0.1",
    "torch>=2.0.0",
    "svgwrite>=1.4.0",
    "pytest>=8.0.0",
    "vtracer>=0.6.11",
    "easyocr>=1.7.0",
    "natsort>=8.4.0",
    "mlx-qwen3-asr>=0.4.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "pdfminer-six>=20250506",
    "pypdfium2>=4.30.0",
]

[project.optional-dependencies]
# 文字起こしの話者分離（--diarize）用。uv sync --extra diarize でインストール
diarize = [
    "mlx-qwen3-asr[diarize,aligner]>=0.4.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    # pyannote が引き込む torchaudio / torchcodec を、既存の torch 2.9 と ABI 互換の版に揃える
    "torchaudio>=2.9,<2.10",
    "torchcodec>=0.8,<0.9",
]

[project.scripts]
site-inspector = "site_inspector.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
